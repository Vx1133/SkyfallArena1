name: Upload Skyfall Arena private test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type UPLOAD_PRIVATE_TEST to update the configured Roblox Start Place. This does not change its audience setting."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skyfall-private-test-upload
  cancel-in-progress: false

jobs:
  upload-private-test:
    name: Build, upload, and cloud-test a private version
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Require explicit manual confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "UPLOAD_PRIVATE_TEST" ]; then
            echo "::error::Confirmation did not match. No Roblox upload was attempted."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Roblox tools
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab
        with:
          version: v1.2.0
          token: ${{ github.token }}
          cache: true

      - name: Verify tools and project structure
        run: |
          set -euo pipefail
          rojo --version
          selene --version
          python tools/validate_project.py
          selene src

      - name: Build Roblox place file
        run: |
          set -euo pipefail
          mkdir -p build
          rojo build default.project.json -o build/SkyfallArena.rbxlx
          test -s build/SkyfallArena.rbxlx

      - name: Upload place to Roblox and verify completion
        id: upload
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: "7975091208"
          ROBLOX_PLACE_ID: "104752078056182"
        run: |
          set -euo pipefail

          : "${ROBLOX_API_KEY:?Missing GitHub Actions secret ROBLOX_API_KEY}"

          echo "Target experience: $ROBLOX_UNIVERSE_ID"
          echo "Target place: $ROBLOX_PLACE_ID"
          echo "Uploading a new place version. This workflow does not change the experience audience setting."

          request_json="$(jq -cn --argjson assetId "$ROBLOX_PLACE_ID" \
            '{assetId: $assetId, assetType: "Place", published: true}')"

          upload_response="$(curl --fail-with-body --silent --show-error --location \
            --request PATCH "https://apis.roblox.com/assets/v1/assets/$ROBLOX_PLACE_ID" \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --form-string "request=$request_json" \
            --form "fileContent=@build/SkyfallArena.rbxlx;type=application/xml")"

          operation_path="$(jq -r '.path // empty' <<< "$upload_response")"
          if [ -z "$operation_path" ]; then
            echo "::error::Roblox did not return an operation path. Upload was not confirmed."
            jq . <<< "$upload_response"
            exit 1
          fi

          operation_id="${operation_path##*/}"
          for attempt in $(seq 1 60); do
            operation_status="$(curl --fail-with-body --silent --show-error --location \
              "https://apis.roblox.com/assets/v1/operations/$operation_id" \
              --header "x-api-key: $ROBLOX_API_KEY")"

            done_value="$(jq -r '.done // false' <<< "$operation_status")"
            if [ "$done_value" = "true" ]; then
              if jq -e '.error != null' >/dev/null <<< "$operation_status"; then
                echo "::error::Roblox reported an upload error:"
                jq '.error' <<< "$operation_status"
                exit 1
              fi

              is_published="$(jq -r '.response.isPublished // false' <<< "$operation_status")"
              if [ "$is_published" != "true" ]; then
                echo "::error::Roblox finished the operation but did not confirm isPublished=true."
                jq . <<< "$operation_status"
                exit 1
              fi

              revision_id="$(jq -r '.response.revisionId // empty' <<< "$operation_status")"
              if [ -z "$revision_id" ]; then
                echo "::error::Roblox confirmed publication but did not return a place version number."
                jq . <<< "$operation_status"
                exit 1
              fi

              echo "revision_id=$revision_id" >> "$GITHUB_OUTPUT"
              {
                echo "## Roblox private test upload"
                echo "- Universe ID: $ROBLOX_UNIVERSE_ID"
                echo "- Place ID: $ROBLOX_PLACE_ID"
                echo "- Roblox version: $revision_id"
                echo "- Roblox confirmed the place version is published."
                echo "- The workflow did not change the experience audience setting."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::Roblox confirmed the place update. Version: $revision_id"
              exit 0
            fi

            sleep 5
          done

          echo "::error::Timed out waiting for Roblox to finish processing the place upload."
          exit 1

      - name: Run headless Roblox Luau smoke tests on the exact uploaded version
        env:
          ROBLOX_LUAU_TEST_API_KEY: ${{ secrets.ROBLOX_LUAU_TEST_API_KEY }}
          ROBLOX_UNIVERSE_ID: "7975091208"
          ROBLOX_PLACE_ID: "104752078056182"
          ROBLOX_PLACE_VERSION: ${{ steps.upload.outputs.revision_id }}
        run: |
          set -euo pipefail
          : "${ROBLOX_LUAU_TEST_API_KEY:?Missing GitHub Actions secret ROBLOX_LUAU_TEST_API_KEY}"
          : "${ROBLOX_PLACE_VERSION:?Missing uploaded Roblox place version}"

          task_request="$(jq -cn --rawfile script tests/cloud_smoke_tests.luau \
            --arg timeout "90s" '{script: $script, timeout: $timeout}')"

          task_response="$(curl --fail-with-body --silent --show-error --location \
            --request POST \
            "https://apis.roblox.com/cloud/v2/universes/$ROBLOX_UNIVERSE_ID/places/$ROBLOX_PLACE_ID/versions/$ROBLOX_PLACE_VERSION/luau-execution-session-tasks" \
            --header "x-api-key: $ROBLOX_LUAU_TEST_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$task_request")"

          task_path="$(jq -r '.path // empty' <<< "$task_response")"
          if [ -z "$task_path" ]; then
            echo "::error::Roblox did not return a Luau execution task path."
            jq . <<< "$task_response"
            exit 1
          fi

          task_path="${task_path#/}"
          task_path="${task_path#cloud/v2/}"
          task_url="https://apis.roblox.com/cloud/v2/$task_path"
          logs_url="$task_url/logs"
          task_state=""

          for attempt in $(seq 1 45); do
            task_status="$(curl --fail-with-body --silent --show-error --location \
              "$task_url" \
              --header "x-api-key: $ROBLOX_LUAU_TEST_API_KEY")"
            task_state="$(jq -r '.state // "STATE_UNSPECIFIED"' <<< "$task_status")"

            if [ "$task_state" = "COMPLETE" ] || [ "$task_state" = "FAILED" ] || [ "$task_state" = "CANCELLED" ]; then
              break
            fi
            sleep 5
          done

          if [ "$task_state" != "COMPLETE" ]; then
            echo "::error::Roblox Luau smoke test did not complete successfully. State: $task_state"
            jq '.error // .' <<< "$task_status"
            if logs_response="$(curl --fail-with-body --silent --show-error --location \
              "$logs_url?view=FLAT" \
              --header "x-api-key: $ROBLOX_LUAU_TEST_API_KEY")"; then
              jq -r '.luauExecutionSessionTaskLogs[]?.messages[]?' <<< "$logs_response"
            fi
            exit 1
          fi

          logs_response="$(curl --fail-with-body --silent --show-error --location \
            "$logs_url?view=FLAT" \
            --header "x-api-key: $ROBLOX_LUAU_TEST_API_KEY")"
          log_messages="$(jq -r '[.luauExecutionSessionTaskLogs[]?.messages[]?] | join("\n")' <<< "$logs_response")"

          if ! grep -Fq "SKYFALL_CLOUD_TESTS_OK" <<< "$log_messages"; then
            echo "::error::The Luau task completed without the expected success marker."
            printf '%s\n' "$log_messages"
            exit 1
          fi

          {
            echo "## Roblox headless Luau smoke tests"
            echo "- Tested exact Place ID: $ROBLOX_PLACE_ID"
            echo "- Tested exact place version: $ROBLOX_PLACE_VERSION"
            echo "- Roblox execution state: $task_state"
            printf '%s\n' "$log_messages"
          } >> "$GITHUB_STEP_SUMMARY"

          printf '%s\n' "$log_messages"

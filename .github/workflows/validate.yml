name: Validate Skyfall Arena

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyfall-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, analyze, visually inspect assets, and build Roblox place
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for GLB visual QA
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/visual-qa-requirements.txt

      - name: Install GLB visual QA libraries
        run: python -m pip install --requirement tools/visual-qa-requirements.txt

      - name: Install pinned Roblox tools
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab
        with:
          version: v1.2.0
          token: ${{ github.token }}
          cache: true

      - name: Verify tool versions
        run: |
          rojo --version
          selene --version
          lune --version
          luau-lsp --version
          stylua --version
          wally --version
          python --version

      - name: Run pure Luau policy tests
        run: |
          lune run tests/lune/update_019_policy.luau
          lune run tests/lune/update_022_policy.luau
          lune run tests/lune/update_023_lighting_profile.luau
          lune run tests/lune/update_023_world_design.luau
          lune run tests/lune/update_023_control_state.luau
          lune run tests/lune/update_024_startup_guard.luau
          lune run tests/lune/update_025_startup_guard.luau
          lune run tests/lune/update_026_arena_bootstrap_guard.luau

      - name: Validate repository structure
        run: python tools/validate_project.py

      - name: Lint Luau source
        run: selene src tests

      - name: Generate Rojo sourcemap
        run: |
          mkdir -p build
          rojo sourcemap default.project.json --include-non-scripts --output build/sourcemap.json

      - name: Download current Roblox type definitions
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://luau-lsp.pages.dev/type-definitions/globalTypes.None.d.luau \
            --output build/globalTypes.d.luau
          test -s build/globalTypes.d.luau

      - name: Luau LSP type analysis baseline
        continue-on-error: true
        run: |
          mapfile -t luau_files < <(find src tests -type f \\( -name '*.lua' -o -name '*.luau' \\) -print | sort)
          luau-lsp analyze --platform roblox \
            --definitions "@roblox=build/globalTypes.d.luau" \
            --sourcemap build/sourcemap.json \
            "${luau_files[@]}"

      - name: StyLua formatting baseline
        continue-on-error: true
        run: stylua --check src tests

      - name: Build Roblox place file
        run: |
          rojo build default.project.json -o build/SkyfallArena.rbxlx
          test -s build/SkyfallArena.rbxlx

      - name: Run GLB visual QA self-test
        run: python tools/visual_qa.py --self-test --output-dir build/visual-qa

      - name: Upload visual QA contact sheet and report
        uses: actions/upload-artifact@v4
        with:
          name: skyfall-visual-qa
          path: build/visual-qa/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyfallArena-place
          path: build/SkyfallArena.rbxlx
          if-no-files-found: error
          retention-days: 14

name: Validate Skyfall Arena

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyfall-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and build Roblox place
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Roblox tools
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab
        with:
          version: v1.2.0
          token: ${{ github.token }}
          cache: true

      - name: Verify tool versions
        run: |
          rojo --version
          selene --version
          lune --version
          luau-lsp --version
          stylua --version
          wally --version

      - name: Run pure Luau policy tests
        run: |
          lune run tests/lune/update_019_policy.luau
          lune run tests/lune/update_022_policy.luau
          lune run tests/lune/update_023_lighting_profile.luau
          lune run tests/lune/update_023_world_design.luau
          lune run tests/lune/update_023_control_state.luau
          lune run tests/lune/update_024_startup_guard.luau
          lune run tests/lune/update_025_startup_guard.luau
          lune run tests/lune/update_026_arena_bootstrap_guard.luau

      - name: Install Python visual audit dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-visual-audit.txt

      - name: Test visual asset audit
        run: python -m unittest discover -s tests/python -v

      - name: Audit repository visual assets
        run: python tools/visual_asset_audit.py --root assets --allow-empty --json-output build/visual_asset_audit.json

      - name: Validate repository structure
        run: python tools/validate_project.py

      - name: Lint Luau source
        run: selene src tests

      - name: Build Roblox place file
        run: |
          mkdir -p build
          rojo build default.project.json -o build/SkyfallArena.rbxlx

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyfallArena-place
          path: |
            build/SkyfallArena.rbxlx
            build/visual_asset_audit.json
          if-no-files-found: error
          retention-days: 14
